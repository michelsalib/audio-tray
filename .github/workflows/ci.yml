name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        # Pinned to the `stable` branch head; pinned by SHA the toolchain must be named explicitly.
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `--workspace` covers crates/taskbar-tap, the DLL that draws our controls
      # into the taskbar. Building it here is the only automated check it gets:
      # what it does can only be verified against a live explorer.exe.
      #
      # Lints are informational (no `-D warnings`) so pre-existing style warnings
      # don't fail the build. Tighten later if you adopt a lint policy.
      - name: Clippy
        run: cargo clippy --all-targets --locked --workspace

      # The developer/diagnostic CLI (src/dev.rs) is off in release builds; check it too so it
      # does not rot.
      - name: Clippy (dev feature)
        run: cargo clippy --all-targets --locked --workspace --features audio-tray/dev

      - name: Build
        run: cargo build --release --locked --workspace

      - name: Build (dev feature)
        run: cargo build --locked --workspace --features audio-tray/dev

      - name: Test
        run: cargo test --locked --workspace
