name: Release

# Push a semver tag to cut a release, e.g.:
#   git tag v0.1.1 && git push origin v0.1.1
# The tag version MUST match `version` in Cargo.toml (enforced below).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        # Pinned to the `stable` branch head; pinned by SHA the toolchain must be named explicitly.
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Resolve + verify version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$TAG_VERSION  cargo=$CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION. Bump Cargo.toml and re-tag."
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      # --workspace so the taskbar TAP (crates/taskbar-tap -> audio_tray_tap.dll)
      # is built alongside the exe. It ships next to it and is what the taskbar
      # strip loads into explorer.exe.
      - name: Build release
        run: cargo build --release --locked --workspace

      # The zip is what the in-app self-updater downloads (src/update.rs): the exe
      # through `self_update`, the TAP through `update::update_tap`, both from this
      # one asset — see RELEASING.md.
      - name: Package self-update asset (zipped exe + TAP)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/dist | Out-Null
          Copy-Item target/release/audio-tray.exe packaging/dist/audio-tray.exe -Force
          Copy-Item target/release/audio_tray_tap.dll packaging/dist/audio_tray_tap.dll -Force
          Compress-Archive -Path packaging/dist/audio-tray.exe, packaging/dist/audio_tray_tap.dll `
            -DestinationPath packaging/dist/audio-tray-x86_64-pc-windows-msvc.zip -Force

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          # Pinned so the installer does not change with the runner image. choco is a
          # no-op when this exact version is already installed.
          choco install innosetup --version=6.7.1 --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $exe = (Resolve-Path target/release/audio-tray.exe).Path
          $tap = (Resolve-Path target/release/audio_tray_tap.dll).Path
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceExe=$exe" "/DSourceTap=$tap" packaging/audio-tray.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # One `<sha256>  <name>` line per downloadable asset. The self-updater refuses
      # any release without it, or any asset that does not match it (src/update.rs,
      # SUMS_ASSET). LF line endings so `sha256sum -c` works anywhere.
      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          Set-Location packaging/dist
          $assets = "AudioTray-${{ steps.ver.outputs.version }}-Setup.exe", "audio-tray-x86_64-pc-windows-msvc.zip"
          $lines = foreach ($a in $assets) { "{0}  {1}" -f (Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant(), $a }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS", ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS

      - name: Check SHA256SUMS
        shell: bash
        working-directory: packaging/dist
        run: sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # All three attach to the release for tag ${{ github.ref_name }}:
          #  - Setup.exe   → humans + winget
          #  - .zip        → the in-app self-updater (src/update.rs)
          #  - SHA256SUMS  → checksums of both; the self-updater refuses a .zip that does not match
          files: |
            packaging/dist/AudioTray-${{ steps.ver.outputs.version }}-Setup.exe
            packaging/dist/audio-tray-x86_64-pc-windows-msvc.zip
            packaging/dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
