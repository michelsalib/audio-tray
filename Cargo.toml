[workspace]
# The TAP DLL that draws our controls into the taskbar. A member so CI, clippy and
# cargo-release cover it; `cargo build` here still builds only audio-tray, since
# the DLL cannot be relinked while Explorer holds it loaded.
members = ["crates/taskbar-tap", "crates/tap-proto"]

[package]
name = "audio-tray"
version = "0.13.0"
edition = "2021"
description = "Windows system-tray app for viewing and switching the default audio output device"
license = "MIT"
readme = "README.md"
repository = "https://github.com/michelsalib/audio-tray"
homepage = "https://github.com/michelsalib/audio-tray"
authors = ["Michel Salib"]
# This is an installable app, not a crates.io library. Keeps `cargo publish`
# (and `cargo release`) from ever trying to publish it to the registry.
publish = false

[features]
# Developer and diagnostic CLI modes (src/dev.rs). Off in release builds; CI builds it too.
dev = []

[dependencies]
# Constants shared with the TAP (window classes, message ids, codes).
tap-proto = { path = "crates/tap-proto" }
ab_glyph = "0.2.32"
anyhow = "1"
# Undocumented IPolicyConfig binding for switching the default endpoint. Isolated
# behind audio/switch.rs (plan §9). Must share the same `windows` version as us.
com-policy-config = "0.6"
directories = "6.0.0"
# In-app GitHub-releases self-updater (see src/update.rs). Uses the `ureq` client
# with `native-tls` = Windows SChannel, so no tokio/reqwest, no ring/rustls, and
# no OpenSSL to build on the MSVC toolchain. archive-zip matches the zipped
# `audio-tray-x86_64-pc-windows-msvc.zip` release asset. checksums verifies every
# download against the release's SHA256SUMS asset before anything is replaced.
self_update = { version = "1.3", default-features = false, features = [
    "ureq",
    "native-tls",
    "github",
    "archive-zip",
    "compression-zip-deflate",
    "checksums",
] }
serde = { version = "1.0.228", features = ["derive"] }
# Hashes the TAP's update archive (update.rs); same major as self_update's checksums feature.
sha2 = "0.11"
toml = "1.1.3"
tray-icon = "0.26.0"
windows-core = "0.61"
# Matrix3x2 and Vector2, which Direct2D takes (the pill); the version `windows` 0.61 uses.
windows-numerics = "0.2"
# The Discord pipe and the Teams socket speak JSON.
serde_json = "1"
# Teams' local API is a plain ws:// socket on localhost: no TLS, no async runtime.
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# Discord's OAuth token exchange and avatars; the same ureq and SChannel TLS self_update uses.
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    # The music half: GlobalSystemMediaTransportControlsSessionManager and friends are the whole
    # of the now-playing feed and its transport controls.
    "Media_Control",
    # Cover art arrives as an IRandomAccessStreamReference; DataReader turns it into bytes.
    "Storage_Streams",
    # IAsyncOperation::get, and the collection the session manager hands back.
    "Foundation",
    "Foundation_Collections",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
    # COPYDATASTRUCT: handing a running TAP its new owner (taskbar::hand_over).
    "Win32_System_DataExchange",
    # GlobalAlloc / GlobalLock, for the clipboard (Settings > Connectors pastes the Discord keys).
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectWrite",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    # PKEY_AppUserModel_ID — the shell's identity for a window, which is how the player's own
    # window is told from a browser tab showing the same title. windows-rs files every canonical
    # PKEY under EnhancedStorage regardless of what it describes.
    "Win32_Storage_EnhancedStorage",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    # CreateEnvironmentBlock: Explorer is relaunched with a fresh user environment, not ours.
    "Win32_System_Environment",
    # CreateEventW / WaitForMultipleObjects, for the microphone-in-use watch.
    "Win32_Security",
    "Win32_System_Registry",
    # MessageBeep (the volume "ding" on a slider change) lives here, not in UI.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
    # GetFileVersionInfoW (the TAP's version stamp, update.rs) and SYNCHRONIZE (waiting on
    # the shell process, taskbar.rs).
    "Win32_Storage_FileSystem",
    # The edge pill: DirectComposition visuals drawn with Direct2D on a D3D11 device, covers and
    # faces decoded by WIC, fullscreen apps detected through an appbar notification.
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_UI_Shell_Common",
    # The Discord pipe, waited on beside the message queue.
    "Win32_System_Pipes",
    "Win32_System_IO",
    # The Teams socket, signalled through WSAEventSelect.
    "Win32_Networking_WinSock",
    # Teams' meeting window (its mic button), where an admin turned Teams' local API off.
    "Win32_UI_Accessibility",
    # The Credential Manager, where the integrations' secrets are kept (src/secrets.rs).
    "Win32_Security_Credentials",
]

[build-dependencies]
winresource = "0.1.31"
