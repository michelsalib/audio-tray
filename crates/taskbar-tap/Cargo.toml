# The XAML Diagnostics TAP: a COM DLL loaded into explorer.exe that draws
# audio-tray's controls into the notification area. See FINDINGS.md.
#
# A workspace member rather than its own workspace root, so CI, clippy and
# cargo-release all see it. Note `cargo build` at the repo root still builds only
# the root package — which is what you want, because the DLL cannot be relinked
# while Explorer has it loaded and a plain build should not start failing for
# that. `cargo build --workspace` (or `-p taskbar-tap`) builds this one.
[package]
name = "taskbar-tap"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# Named for what `taskbar::enable()` loads, so a workspace build drops the DLL
# straight where the app looks for it — no staging step, no second name to keep
# in step.
name = "audio_tray_tap"
# cdylib = the TAP itself, loaded into explorer.exe.
# rlib   = lets the injector bin share the CLSID/endpoint constants.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "xaml-tap-inject"
path = "src/main.rs"

[dependencies]
# Shares the main crate's pin — same workspace now, so a skew on GUID/HRESULT/BSTR
# types is impossible rather than merely discouraged.
windows-core = "0.61"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",             # IObjectWithSite (the TAP site contract)
    "Win32_System_LibraryLoader",   # GetProcAddress / GetModuleFileNameW
    "Win32_System_Threading",
    "Win32_System_Registry",              # accent colour
    "Win32_System_Diagnostics_ToolHelp", # explorer.exe PID lookup
    "Win32_System_Diagnostics_Debug",    # OutputDebugStringW
    "Win32_System_WinRT",                # RoGetActivationFactory
    "Win32_UI_WindowsAndMessaging",      # GetShellWindow
    # `RegisterClassW`/`WNDCLASSW` are gated behind Gdi (the struct carries
    # HBRUSH/HICON), and the revert channel needs its own window class.
    "Win32_Graphics_Gdi",
]
